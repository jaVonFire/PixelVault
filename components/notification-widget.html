<!-- ============================================================
  COMPONENTE: NOTIFICACIONES / RECORDATORIOS DE CARRITO (copia de referencia)
  Identico en todas las paginas. Solo lo muestra notifications.js
  (usuarios con rol 'cliente'; el administrador no lo ve).
============================================================ -->
<div class="notif-toggle" id="notifToggle" role="button" tabindex="0" aria-label="Notificaciones">
  <i class="fas fa-bell"></i>
  <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
</div>
<div class="notif-window" id="notifWindow" role="dialog">
  <div class="notif-header">
    <h4><i class="fas fa-bell"></i> <span data-i18n="notif_title">Notificaciones</span></h4>
    <div style="display:flex;align-items:center;gap:6px;">
      <button class="notif-mark-all" id="notifMarkAll" data-i18n="notif_mark_all">Marcar leidas</button>
      <button class="chat-close" id="notifClose"><i class="fas fa-xmark"></i></button>
    </div>
  </div>
  <div class="notif-body" id="notifBody"></div>
</div>
